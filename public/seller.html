<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Dashboard | OmniMart PK</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-100"><header class="bg-blue-900 text-white p-5 flex justify-between"><h1 class="text-xl font-bold">OmniMart PK · Seller Dashboard</h1><button onclick="logout()">Log out</button></header><main class="max-w-5xl mx-auto p-5 space-y-5"><section class="bg-white rounded-xl p-5 shadow"><h2 class="font-bold text-xl mb-4">Add Product</h2><form id="productForm" class="grid sm:grid-cols-2 gap-3"><input name="name" required placeholder="Product name" class="border rounded p-2"><input name="price" type="number" min="0" step="0.01" required placeholder="Price (PKR)" class="border rounded p-2"><input name="stock" type="number" min="0" placeholder="Stock" class="border rounded p-2"><input name="category" placeholder="Category" class="border rounded p-2"><input name="imageUrl" placeholder="Image URL (optional)" class="border rounded p-2 sm:col-span-2"><textarea name="description" placeholder="Description" class="border rounded p-2 sm:col-span-2"></textarea><button class="bg-orange-500 text-white rounded p-2 sm:col-span-2">Save Product</button></form><p id="productMsg" class="mt-2 text-sm"></p></section><section class="bg-white rounded-xl p-5 shadow"><h2 class="font-bold text-xl mb-3">My Products</h2><div id="products" class="space-y-2"></div></section><section class="bg-white rounded-xl p-5 shadow"><h2 class="font-bold text-xl mb-3">My Orders</h2><div id="orders" class="space-y-3"></div></section></main><script src="/dashboard.js"></script></body></html>
