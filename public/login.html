<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Login | OmniMart PK</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-100 min-h-screen grid place-items-center p-4"><form id="login" class="bg-white rounded-2xl shadow p-7 w-full max-w-md"><h1 class="text-2xl font-bold mb-1">OmniMart PK</h1><p class="text-slate-500 mb-6">Admin / Seller sign in</p><label class="block mb-2">Email</label><input id="email" type="email" required class="border rounded-lg p-3 w-full mb-4" placeholder="Email"><label class="block mb-2">Password</label><input id="password" type="password" required class="border rounded-lg p-3 w-full mb-4" placeholder="Password"><button class="bg-blue-900 text-white rounded-lg p-3 w-full">Sign in</button><p id="msg" class="mt-4 text-sm"></p><p class="mt-4 text-sm"><a class="underline" href="/">Back to store</a></p></form><script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('msg');msg.textContent='Signing in…';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(!r.ok)throw Error(d.message||'Login failed');localStorage.setItem('omnimartToken',d.token);localStorage.setItem('omnimartUser',JSON.stringify(d.user));location.href=d.user.role==='admin'?'/admin.html':'/seller.html'}catch(err){msg.textContent=err.message}};</script></body></html>
